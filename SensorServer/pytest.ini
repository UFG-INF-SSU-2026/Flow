[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers -m "not banco"
markers =
    unit: modulos isolados (tests/unit), marcado automaticamente pela pasta
    integration: rotas HTTP, SSE e ponta a ponta (tests/integration), marcado automaticamente pela pasta
    banco: contrato contra PostgreSQL real (tests/banco); fora do padrao, rode com: pytest -m banco
