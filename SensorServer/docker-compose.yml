# Banco do SensorServer (PostgreSQL com a extensao TimescaleDB, usada so na tabela "leituras"). SO a borda conversa com ele.
#
#   Subir:      docker compose up -d
#   Ver estado: docker compose ps          (aguarde "healthy")
#   Logs:       docker compose logs -f db
#   Console:    docker compose exec db psql -U $FLOW_DB_ADMIN_USER -d $FLOW_DB_NAME     (papel administrativo)
#   Parar:      docker compose down        (os dados ficam no volume)
#   APAGAR TUDO (dados inclusive): docker compose down -v
#
# As variaveis FLOW_DB_* vem do arquivo ".env" desta pasta (o mesmo da borda; ver .env.example).
#
# Dois papeis: o que este compose cria (FLOW_DB_ADMIN_USER e FLOW_DB_ADMIN_PASSWORD) e o ADMINISTRATIVO (superusuario, dono do
# esquema; so o compose, "python -m flow_db" e o backup o usam). A borda NAO o usa: ela entra como "flow_borda" (so
# SELECT/INSERT/UPDATE/DELETE, sem DDL), criado por "python -m flow_db migrar" com a senha de FLOW_DB_PASSWORD.
# ATENCAO: usuario, senha e nome do banco so valem na PRIMEIRA subida (volume vazio). Mudar o .env depois
# nao altera o banco ja criado; para recomecar do zero, use "down -v".
#
# TLS: o banco apresenta o certificado emitido para ele pela CA do projeto (certs/banco.crt e certs/banco.key, gerados por
# "python scripts/gerar_certificado.py"; scripts/preparar.* os geram antes de subir) e a borda conecta com sslmode=verify-full,
# confiando so em certs/ca.crt. O container recebe SO esses dois arquivos: a chave da CA (certs/ca.key) nunca e montada.
# Subir sem certs/banco.crt e certs/banco.key faz o container falhar. Certificado reemitido (--forcar): "docker compose
# restart db". Nao exige recriar o volume.

name: flow

services:
  db:
    # PostgreSQL 17 com o TimescaleDB ja carregado na subida (a tabela "leituras" vira hypertable na migracao 0001).
    # A versao MAIOR do PostgreSQL (17) fica fixa: trocar exige dump/restore do volume. Esta imagem e baseada em Alpine,
    # entao um volume criado com a imagem "postgres:17" simples NAO serve: recrie com "docker compose down -v".
    image: timescale/timescaledb:latest-pg17
    container_name: flow-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${FLOW_DB_ADMIN_USER:-flow}
      POSTGRES_PASSWORD: ${FLOW_DB_ADMIN_PASSWORD:?defina FLOW_DB_ADMIN_PASSWORD no .env}
      POSTGRES_DB: ${FLOW_DB_NAME:-flow}

    # Publicada SO no loopback: o servidor (rodando no host) alcanca em localhost:FLOW_DB_PORT, e nada
    # da rede local alcanca o banco. NAO remova o "127.0.0.1:" (sem ele a porta abre para toda a rede).
    ports:
      - "127.0.0.1:${FLOW_DB_PORT:-5432}:5432"

    volumes:
      - flow_db_data:/var/lib/postgresql/data
      - ./certs/banco.crt:/certs/banco.crt:ro
      - ./certs/banco.key:/certs/banco.key:ro

    # O PostgreSQL so aceita uma chave que seja do usuario "postgres" com permissao 0600, o que um arquivo montado do host
    # raramente e. Por isso o entrypoint copia o par para dentro do container (com dono e permissao certos) e entrega ao
    # entrypoint oficial, que continua igual. O "command" e explicito porque trocar o entrypoint descarta o padrao da imagem.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /etc/flow-tls &&
        install -m 0644 -o postgres -g postgres /certs/banco.crt /etc/flow-tls/banco.crt &&
        install -m 0600 -o postgres -g postgres /certs/banco.key /etc/flow-tls/banco.key &&
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/flow-tls/banco.crt
      - -c
      - ssl_key_file=/etc/flow-tls/banco.key

    # O servidor deve esperar este estado antes de conectar (o container "sobe" antes de aceitar conexoes).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  flow_db_data:
